name: Build and push foodios-pds
on:
  workflow_dispatch
  # push:
  #   branches:
  #     - main
env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
  IMAGE_NAME: foodios-atproto-pds

jobs:
  build:
    if: github.repository == 'inconceivableza/atproto'
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch branding.json from social-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the date of the current commit in this atproto repo
          COMMIT_DATE=$(git log -1 --format=%cI)
          echo "Current atproto commit date: ${COMMIT_DATE}"

          # Find the latest social-app commit on main before this date
          SOCIAL_SHA=$(gh api \
            "repos/inconceivableza/social-app/commits?sha=main&until=${COMMIT_DATE}&per_page=1" \
            --jq '.[0].sha' 2>/dev/null || true)

          if [ -z "${SOCIAL_SHA}" ] || [ "${SOCIAL_SHA}" = "null" ]; then
            echo "Could not find social-app commit before ${COMMIT_DATE}, using latest main"
            SOCIAL_SHA="main"
          fi

          echo "Using social-app ref: ${SOCIAL_SHA}"

          # Download branding.json from that commit
          gh api \
            "repos/inconceivableza/social-app/contents/conf/branding.json?ref=${SOCIAL_SHA}" \
            --jq '.content' | base64 -d > branding.json

          echo "Fetched branding.json:"
          cat branding.json

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare platform tag
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "tag=${platform//\//-}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=-${{ steps.platform.outputs.tag }},format=long

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          file: ./services/pds/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:buildcache-${{ steps.platform.outputs.tag }}
            type=registry,ref=${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:buildcache-${{ steps.platform.outputs.tag }},mode=max
    outputs:
      digest-amd64: ${{ matrix.platform == 'linux/amd64' && steps.build-and-push.outputs.digest || '' }}
      digest-arm64: ${{ matrix.platform == 'linux/arm64' && steps.build-and-push.outputs.digest || '' }}

  create-manifest:
    if: github.repository == 'inconceivableza/atproto' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long

      - name: Create and push multi-platform manifest
        run: |
          # Get the tag without platform suffix
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)

          # Create manifest from platform-specific images
          docker buildx imagetools create -t ${TAG} \
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:$(git rev-parse HEAD)-linux-amd64 \
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:$(git rev-parse HEAD)-linux-arm64

          echo "Created multi-platform manifest: ${TAG}"
